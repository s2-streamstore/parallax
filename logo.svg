<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 100" width="380" height="100">
  <defs>
    <linearGradient id="line1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4f63d2;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="line2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c6fcd;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="line3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6b7fd4;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Three lines converging from left spread to center point -->
  <line x1="4"  y1="12" x2="148" y2="50" stroke="url(#line1)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="4"  y1="50" x2="148" y2="50" stroke="url(#line2)" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="4"  y1="88" x2="148" y2="50" stroke="url(#line3)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Convergence point -->
  <circle cx="148" cy="50" r="4.5" fill="#6366f1"/>

  <!-- Wordmark -->
  <text x="168" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', sans-serif" font-size="24" font-weight="500" letter-spacing="-0.8" fill="#e4e4e7">parallax</text>
</svg>
